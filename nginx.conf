# Server block for the sorour-web container (nginx:alpine).
# deploy.sh installs it as /etc/sorour-web/default.conf on the VPS, which the
# container mounts as /etc/nginx/conf.d/default.conf. TLS, the domain name and
# HTTP->HTTPS live in Nginx Proxy Manager and Cloudflare, not here.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Inherited only by locations that declare no add_header of their own.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css text/plain text/xml application/xml image/svg+xml;

    # The webroot holds only site files, but never serve dotfiles regardless.
    location ~ /\. {
        return 404;
    }

    # Which commit is live. Never cached, so CI and humans see the truth.
    location = /version.txt {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
